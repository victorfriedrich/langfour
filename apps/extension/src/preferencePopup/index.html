<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Langfour</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: white;
      color: #333;
      width: 380px;
      /* Safari on iOS shows the popup as a sheet narrower than 380px. */
      max-width: 100vw;
    }
    
    .container {
      padding: 20px;
    }
    
    .header {
      margin-bottom: 20px;
    }
    
    .logo-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    
    .logo {
      font-size: 22px;
      font-weight: bold;
    }
    
    .version {
      font-size: 10px;
      color: #888;
    }
    
    .input-group {
      display: flex;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 16px;
      height: 46px;
    }
    
    input[type="email"] {
      flex-grow: 1;
      padding: 12px;
      border: 1px solid #ddd;
      border-right: none;
      border-top-left-radius: 4px;
      border-bottom-left-radius: 4px;
      font-size: 14px;
      color: #333;
      height: 46px;
    }
    
    input[type="email"]:focus {
      outline: none;
      border-color: #4f46e5;
    }
    
    #loginBtn {
      display: inline-flex;
      align-items: center;
      padding: 0 16px;
      border: none;
      border-top-right-radius: 4px;
      border-bottom-right-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      color: white;
      background-color: #4f46e5;
      cursor: pointer;
      transition: background-color 0.2s;
      min-width: 80px;
      justify-content: center;
    }
    
    #loginBtn:hover:not(:disabled) {
      background-color: #4338ca;
    }
    
    #loginBtn:disabled {
      background-color: #a5b4fc;
      cursor: not-allowed;
    }
    
    .button-content,
    .loading-content {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .loading-content {
      display: none;
    }
    
    button.loading .button-content {
      display: none;
    }
    
    button.loading .loading-content {
      display: flex;
    }
    
    .hidden {
      display: none;
    }
    
    
    .spinner { animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loginBtn.loading:disabled { background-color: #4f46e5; cursor: progress; }
    .sent-panel { display: none; text-align: center; padding: 8px 0 4px; }
    .sent #loginForm, .sent #loginError, .sent .or-divider, .sent #signUpBtn { display: none; }
    .sent .sent-panel { display: block; animation: fade-in 0.25s ease-out; }
    @keyframes fade-in { from { opacity: 0; transform: translateY(4px); } }
    .sent-icon {
      display: inline-grid; place-items: center;
      width: 44px; height: 44px; border-radius: 50%;
      background: #eef2ff; color: #4f46e5;
    }
    .sent-title { margin-top: 10px; font-size: 16px; font-weight: 600; }
    .sent-text { margin-top: 6px; font-size: 13px; line-height: 1.5; color: #555; overflow-wrap: anywhere; }
    .sent-actions { margin-top: 14px; display: flex; justify-content: center; gap: 8px; font-size: 13px; color: #aaa; }
    .code-form { margin-top: 14px; display: flex; gap: 8px; justify-content: center; }
    .code-form.hidden { display: none; }
    #codeInput {
      width: 140px; height: 42px; padding: 0 12px;
      border: 1px solid #ddd; border-radius: 4px;
      font-size: 18px; letter-spacing: 0.15em; text-align: center; color: #333;
    }
    #codeInput:focus { outline: none; border-color: #4f46e5; }
    #codeBtn {
      height: 42px; padding: 0 16px; border: none; border-radius: 4px;
      background-color: #4f46e5; color: #fff; font-size: 14px; font-weight: 500; cursor: pointer;
    }
    #codeBtn:hover:not(:disabled) { background-color: #4338ca; }
    #codeBtn:disabled { background-color: #a5b4fc; cursor: progress; }
    #topSection { padding-bottom: 0; }
    #topSection .header { margin-bottom: 12px; }
    #loggedOutPane, #loggedInPane { padding-top: 16px; }
    /* Same family as the popup's other primary buttons (Log in, Review
       flashcards): flat indigo, 4px corners, one label. The page it opens
       is a quiet line underneath. */
    .reader-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; height: 46px; padding: 0 16px;
      border: none; border-radius: 4px;
      background-color: #4f46e5; color: #fff;
      font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
      transition: background-color 0.2s;
    }
    .reader-btn:hover:not(:disabled) { background-color: #4338ca; }
    .reader-btn:disabled { cursor: progress; }
    .reader-btn .spinner { display: none; }
    .reader-btn.loading .spinner { display: block; }
    .reader-btn.loading .reader-icon { display: none; }
    .reader-page {
      margin-top: 6px; font-size: 12.5px; color: #888; text-align: center;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .reader-page:empty { display: none; }
    #readerError { margin: 8px 0 0; }
    .link-btn { background: none; border: none; padding: 0; font: inherit; color: #4f46e5; cursor: pointer; }
    .link-btn:hover:not(:disabled) { text-decoration: underline; }
    .link-btn:disabled { color: #888; cursor: default; }
    .form-message {
      font-size: 13px;
      margin-top: 10px;
      color: #555;
    }
    .form-message.error {
      color: #b91c1c;
    }
    input:focus-visible, button:focus-visible, .language-button:focus-visible {
      outline: 2px solid #4f46e5;
      outline-offset: 2px;
    }
    @media (prefers-color-scheme: dark) {
      body { background-color: #1f2937; color: #e5e7eb; }
      .version, .footer-text, .or-divider { color: #9ca3af; }
      input[type="email"], #codeInput { background: #111827; color: #f3f4f6; border-color: #374151; }
      .or-divider:before, .or-divider:after { background: #374151; }
      .language-button { border-color: #374151; }
      .language-button.active { background-color: rgba(129, 140, 248, 0.18); }
      #userInfo { color: #d1d5db; }
      .form-message, .sent-text { color: #d1d5db; }
      .sent-icon { background: rgba(129, 140, 248, 0.18); color: #a5b4fc; }
      .link-btn { color: #a5b4fc; }
      .form-message.error { color: #fca5a5; }
      .footer-text a, .btn-outline, .quick-link { color: #a5b4fc; }
      .quick-link { border-color: #a5b4fc; }
      .quick-link.primary { color: #fff; border-color: #4f46e5; }
      .btn-outline { border-color: #a5b4fc; }
    }
    .footer-text {
      font-size: 12px;
      text-align: center;
      color: #888;
      margin-top: 24px;
      line-height: 1.5;
    }
    
    .footer-text a {
      color: #4f46e5;
      text-decoration: none;
    }
    
    .footer-text a:hover {
      text-decoration: underline;
    }
    
    .or-divider {
      display: flex;
      align-items: center;
      margin: 20px 0;
      color: #888;
      font-size: 14px;
    }
    
    .or-divider:before,
    .or-divider:after {
      content: "";
      flex: 1;
      height: 1px;
      background: #ddd;
    }
    
    .or-divider:before {
      margin-right: 10px;
    }
    
    .or-divider:after {
      margin-left: 10px;
    }
    
    .btn-outline {
      display: block;
      width: 100%;
      padding: 12px;
      background-color: transparent;
      border: 1px solid #4f46e5;
      color: #4f46e5;
      border-radius: 4px;
      font-size: 15px;
      cursor: pointer;
      text-align: center;
      font-weight: 500;
      height: 46px;
    }
    
    .btn-outline:hover {
      background-color: rgba(79, 70, 229, 0.1);
    }
    
    /* Logged in view styles */
    #loggedInPane {
      padding: 20px;
    }

    #languageButtons {
      display: grid;
      grid-template-columns: repeat(1, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    
    .language-button {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .language-button:hover {
      border-color: #4f46e5;
    }
    
    .language-button.active {
      border-color: #4f46e5;
      background-color: rgba(79, 70, 229, 0.1);
    }
    
    .language-button img {
      width: 24px;
      height: auto;
      border-radius: 2px;
    }
    
    .quick-links {
      display: flex;
      gap: 8px;
    }
    .quick-link {
      flex: 1;
      height: 38px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid #4f46e5;
      background: transparent;
      color: #4f46e5;
    }
    .quick-link:hover { background-color: rgba(79, 70, 229, 0.08); }
    .quick-link.primary { background-color: #4f46e5; color: #fff; }
    .quick-link.primary:hover { background-color: #4338ca; }
    .footer {
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    #userInfo {
      font-size: 14px;
      color: #555;
    }
    
    #logoutBtn {
      background-color: #4f46e5;
      border: none;
      border-radius: 4px;
      padding: 8px 12px;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }
    
    #logoutBtn:hover {
      background-color: #4338ca;
    }
  </style>
</head>
<body>
  <div id="topSection" class="container">
    <div class="header">
      <div class="logo-section">
        <div class="logo">Langfour</div>
        <div class="version" id="version"></div>
      </div>
    </div>
    <!-- The main action, signed in or not: shown when the current tab is a web page. -->
    <div id="readerCard" class="hidden">
      <button type="button" id="readerBtn" class="reader-btn">
        <svg class="reader-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6.5C10.3 5.2 7.9 4.5 4 4.5v13c3.9 0 6.3.7 8 2 1.7-1.3 4.1-2 8-2v-13c-3.9 0-6.3.7-8 2z"/><path d="M12 6.5v13"/></svg>
        <svg class="spinner" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.2-8.55"/></svg>
        <span id="readerBtnTitle">Read this page</span>
      </button>
      <p id="readerPageTitle" class="reader-page"></p>
      <p id="readerError" class="form-message error hidden" role="alert"></p>
    </div>
  </div>

  <!-- Logged Out (Login) View -->
  <div id="loggedOutPane" class="container">
    
    <form id="loginForm">
      <div class="input-group">
        <input 
          type="email" 
          id="email" 
          required 
          placeholder="Enter your email address"
          autocomplete="email"
        >
        <button type="submit" id="loginBtn">
          <span class="button-content">
            <span>Log in</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </span>
          <span class="loading-content">
            <svg class="spinner" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.2-8.55"/></svg>
            <span>Sending…</span>
          </span>
        </button>
      </div>
    </form>
    
    <p id="loginError" class="form-message error hidden" role="alert"></p>
    <div id="sentPanel" class="sent-panel" role="status" aria-live="polite">
      <div class="sent-icon" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
      </div>
      <p class="sent-title">Check your email</p>
      <p class="sent-text">We sent a sign-in link to <strong id="sentEmail"></strong>. <span id="sentHint">Open it in this browser.</span></p>
      <form id="codeForm" class="code-form hidden">
        <input
          type="text"
          id="codeInput"
          inputmode="numeric"
          autocomplete="one-time-code"
          pattern="[0-9 ]*"
          maxlength="12"
          placeholder="123456"
          aria-label="Sign-in code"
        >
        <button type="submit" id="codeBtn">Sign in</button>
      </form>
      <p id="codeError" class="form-message error hidden" role="alert"></p>
      <div class="sent-actions">
        <button type="button" id="resendBtn" class="link-btn" disabled>Resend in <span id="timer">60</span>s</button>
        <span aria-hidden="true">·</span>
        <button type="button" id="changeEmailBtn" class="link-btn">Use another email</button>
      </div>
    </div>

    <div class="or-divider">or</div>
    
    <button class="btn-outline" id="signUpBtn">Sign Up</button>
    
    <div class="footer-text">
      By logging in you accept our <a href="https://app.langfour.com/privacy" target="_blank" rel="noreferrer">Privacy Policy</a>
    </div>
  </div>
  
  <!-- Logged In View -->
  <div id="loggedInPane" class="hidden">
    <div id="languageButtons">
      <!-- Language buttons will be inserted here -->
    </div>
    <div class="quick-links">
      <button type="button" id="reviewBtn" class="quick-link primary">Review flashcards</button>
      <button type="button" id="openAppBtn" class="quick-link">Open Langfour</button>
    </div>
    <div class="footer">
      <div id="userInfo"></div>
      <button id="logoutBtn">Logout</button>
    </div>
  </div>

  <!-- Make sure to use type="module" to support imports -->
  <script type="module" src="index.ts"></script>
</body>
</html>
