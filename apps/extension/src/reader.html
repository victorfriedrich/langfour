<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Langfour Reader</title>
  <link rel="stylesheet" href="reader.css" />
</head>
<body>
  <div id="scroll-progress-bar"></div>

  <!-- Top bar: Safari owns the bottom of the screen on iPhone. Hides while
       reading down, comes back on scrolling up. -->
  <header id="topbar" class="topbar">
    <button type="button" class="topbar-back" id="back-to-page" aria-label="Back to the original page">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M15.5 4.5 8 12l7.5 7.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="back-label">Original</span>
    </button>
    <div class="topbar-actions">
      <button type="button" class="icon-btn" id="toggle-highlight" title="Highlight new words" aria-label="Highlight new words" aria-pressed="true">
        <span class="hl-sample" aria-hidden="true">abc</span>
      </button>
      <button type="button" class="icon-btn aa-btn" id="reader-settings" title="Display settings" aria-label="Display settings" aria-expanded="false">
        <span class="aa" aria-hidden="true"><span class="aa-small">A</span><span class="aa-large">A</span></span>
      </button>
    </div>
  </header>

  <!-- Display settings: a popover under the Aa button, a bottom sheet on phones. -->
  <div class="settings-panel" id="settings-panel" role="dialog" aria-label="Display settings">
    <div class="sheet-handle" aria-hidden="true"></div>

    <div class="settings-group size-control" role="group" aria-label="Text size">
      <button type="button" class="size-btn" id="decrease-font" aria-label="Smaller text">A</button>
      <span class="size-value" id="font-size-value" aria-live="polite">18px</span>
      <button type="button" class="size-btn size-btn-large" id="increase-font" aria-label="Larger text">A</button>
    </div>

    <div class="settings-group theme-options" role="radiogroup" aria-label="Theme">
      <button type="button" class="theme-option theme-light" id="theme-light" role="radio" aria-label="Light">Aa</button>
      <button type="button" class="theme-option theme-sepia" id="theme-sepia" role="radio" aria-label="Sepia">Aa</button>
      <button type="button" class="theme-option theme-dark" id="theme-dark" role="radio" aria-label="Dark">Aa</button>
    </div>

    <div class="settings-group segmented" role="radiogroup" aria-label="Font">
      <button type="button" class="font-option font-serif" id="font-serif" role="radio">New York</button>
      <button type="button" class="font-option font-sans" id="font-sans" role="radio">San Francisco</button>
    </div>

    <div class="settings-group stepper-row">
      <span class="settings-label">Line spacing</span>
      <div class="stepper">
        <button type="button" class="control-btn" id="decrease-line-height" aria-label="Less line spacing">−</button>
        <span class="control-value" id="line-height-value">1.7</span>
        <button type="button" class="control-btn" id="increase-line-height" aria-label="More line spacing">+</button>
      </div>
    </div>

    <div class="settings-group stepper-row width-row">
      <span class="settings-label">Text width</span>
      <div class="stepper">
        <button type="button" class="control-btn" id="decrease-width" aria-label="Narrower text">−</button>
        <span class="control-value" id="width-value">700px</span>
        <button type="button" class="control-btn" id="increase-width" aria-label="Wider text">+</button>
      </div>
    </div>

    <!-- Filled by reader.ts. The Safari build has no popup, so the account
         and the language being learned are managed here. -->
    <div class="settings-account" id="settings-account" hidden>
      <label class="account-language" id="account-language">
        <span class="settings-label">Learning</span>
        <span class="account-language-value">
          <span id="account-language-name"></span>
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <!-- Transparent over the row: a tap opens the system picker. -->
        <select id="account-languages" aria-label="Language you are learning"></select>
      </label>
      <button type="button" class="settings-link" id="access-flashcards">
        <span id="review-label">Review flashcards</span>
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <p class="account-row">
        <span class="account-email" id="account-email"></span>
        <button type="button" class="account-signout" id="sign-out">Log out</button>
      </p>
    </div>
    <button type="button" class="settings-link" id="sign-in" hidden>
      Sign in
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <main id="reader-container">
    <!-- The article is rendered here by reader.ts -->
  </main>

  <script type="module" src="reader.ts"></script>
</body>
</html>
