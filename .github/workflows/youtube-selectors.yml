name: YouTube selectors

# Checks the extension's YouTube selectors against youtube.com itself, in the
# runner's Google Chrome (apps/extension/src/youtubeSelectors.live.test.ts).
# YouTube changes its markup without notice; a failure here means the fit
# badges, the Favourite button or the Langfour tab may have stopped showing.
# GitHub turns the schedule off after 60 days without a commit; re-enable it
# on the Actions tab (apps/extension/test/youtube/README.md).
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/extension/src/youtubeSelectors*.ts"
      - "apps/extension/src/youtubeChannel.ts"
      - ".github/workflows/youtube-selectors.yml"

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:youtube --workspace=spotlight-lingo
