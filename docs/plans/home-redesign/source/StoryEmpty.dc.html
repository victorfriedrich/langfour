<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Filters that leave nothing</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #ffffff; font-family: Geist, system-ui, sans-serif; color: #111827">
  <dc-import name="Main" hover-index="{{none}}" empty="{{yes}}" hint-size="1440px,1500px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { none: -1, yes: true };
  }
}
</script>
</body>
</html>
